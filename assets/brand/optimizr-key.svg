<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080b12"/><stop offset=".55" stop-color="#0a0e18"/><stop offset="1" stop-color="#0b1019"/>
    </linearGradient>
    <radialGradient id="g1" cx="0" cy="0" r="1" gradientTransform="translate(300 280) rotate(90) scale(330 330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c5cff" stop-opacity=".4"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0" cy="0" r="1" gradientTransform="translate(760 470) rotate(90) scale(300 260)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" stop-opacity=".2"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#1a2332" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="240" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c5cff"/><stop offset=".6" stop-color="#22d3ee"/><stop offset="1" stop-color="#c9fb4b"/>
    </linearGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <rect width="900" height="560" fill="url(#bg)"/>
  <rect width="900" height="560" fill="url(#grid)" opacity=".28"/>
  <rect width="900" height="560" fill="url(#g1)"/>
  <rect width="900" height="560" fill="url(#g2)"/>

  <g font-family="Avenir Next, Helvetica Neue, Helvetica, sans-serif">
    <text x="56" y="60" fill="#7c8aa3" font-size="13" font-weight="600" letter-spacing="4">OPTIMIZR / MACOS</text>
    <rect x="744" y="38" width="102" height="30" rx="15" fill="#0f1724" stroke="#26344b"/>
    <text x="795" y="58" fill="#5eead4" font-size="11" font-weight="600" letter-spacing="2" text-anchor="middle">READ-ONLY</text>
  </g>

  <g>
    <circle cx="300" cy="292" r="178" fill="none" stroke="#26324a" stroke-width="1.2" opacity=".8"/>
    <circle cx="300" cy="292" r="142" fill="none" stroke="#2d3b57" stroke-width="1.1" stroke-dasharray="2 8"/>
    <circle cx="300" cy="292" r="216" fill="none" stroke="#202b3e" stroke-width="1" stroke-dasharray="1 10"/>
    <circle cx="300" cy="292" r="190" fill="none" stroke="#7c5cff" stroke-opacity=".25" stroke-width="14" filter="url(#soft)"/>
  </g>

  <g font-family="Avenir Next, Helvetica Neue, Helvetica, sans-serif">
    <g>
      <text x="512" y="196" fill="#e6ecf5" font-size="20" font-weight="600">Memory</text>
      <text x="792" y="196" fill="#8b99ad" font-size="14" text-anchor="end">3 findings</text>
      <rect x="512" y="212" width="280" height="10" rx="5" fill="#1b2433"/>
      <rect x="512" y="212" width="196" height="10" rx="5" fill="#7c5cff"/>
    </g>
    <g>
      <text x="512" y="274" fill="#e6ecf5" font-size="20" font-weight="600">CPU</text>
      <text x="792" y="274" fill="#8b99ad" font-size="14" text-anchor="end">1 finding</text>
      <rect x="512" y="290" width="280" height="10" rx="5" fill="#1b2433"/>
      <rect x="512" y="290" width="98" height="10" rx="5" fill="#22d3ee"/>
    </g>
    <g>
      <text x="512" y="352" fill="#e6ecf5" font-size="20" font-weight="600">Storage</text>
      <text x="792" y="352" fill="#8b99ad" font-size="14" text-anchor="end">5 findings</text>
      <rect x="512" y="368" width="280" height="10" rx="5" fill="#1b2433"/>
      <rect x="512" y="368" width="162" height="10" rx="5" fill="#c9fb4b"/>
    </g>
  </g>

  <rect x="512" y="420" width="280" height="3" rx="1.5" fill="url(#accent)" opacity=".85"/>
  <text x="512" y="464" fill="#61708a" font-size="13" font-weight="500" letter-spacing="2.4">EVIDENCE · SEVERITY · REMEDIATION</text>
</svg>
